[package]
name = "unifictl"
version = "0.3.3"
edition = "2024"
rust-version = "1.99"
description = "Command-line client for UniFi network controllers"
repository = "https://github.com/bwilczynski/unifictl"

[features]
# Enables the hidden --fixtures flag used by the integration tests.
fixtures = []

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = { version = "=4.6.11", features = ["unstable-dynamic"] }
jiff = "0.2.38"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "cookies", "rustls"] }
rpassword = "7.5.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tabwriter = "1.4.1"
thiserror = "2.0.21"
toml = "1.1.8"

[dev-dependencies]
httpmock = "0.8.3"
tempfile = "3.27.0"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
